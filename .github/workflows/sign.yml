name: Netease Daily Sign

on:
  schedule:
       - cron: "5 1 * * *"     # 每天 09:05 (UTC+8) 主签到
       - cron: "7 4 * * *"     # 每天 12:07 (UTC+8) 兜底补签
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run sign
        run: node sign.js
        env:
          TZ: Asia/Shanghai
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
